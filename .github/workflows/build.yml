name: Build CloudStream Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugins
        run: ./gradlew make --stacktrace

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: "**/build/*.cs3"
          if-no-files-found: error
